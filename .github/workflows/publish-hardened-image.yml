# Builds and publishes Idlefy's hardened image for AI agents
# (idlefy-hardened-agent-ubuntu-24.04-amd64-YYYYMMDD-NN) from a platform tag.
# Design: docs/design/hardened-image.md.
#
# Run it ON A TAG REF: Actions -> publish-hardened-image -> Run workflow ->
# "Use workflow from" -> Tags -> vX.Y.Z. A dispatch from a branch is refused.
# A test build runs on a pre-release tag vX.Y.Z-rc.N with public=false; a
# public build from one is refused here and again by the driver.
# The schedule rebuilds the newest vX.Y.Z tag once a month (OS updates, agent
# CLIs); it never picks a pre-release tag.
#
# One job touches AWS, behind the protected environment `hardened-publish`:
# one approval covers the account guard and the build. The guard runs first and
# a failure stops the job before anything is built.
#
# Never set HARDENED_SKIP_TAG_CHECK or HARDENED_TODAY here. They are test hooks
# of scripts/hardened-image-build.sh: the first skips the check that the
# checkout is the tag's commit, the second replaces the date in the image name.
#
# No input reaches a `run:` script through ${{ }}: every value goes through
# `env:` and is quoted, and the scripts validate each one again.
name: publish-hardened-image

on:
  workflow_dispatch:
    inputs:
      public:
        type: boolean
        default: true
        description: "false = private build for inspection"
  schedule:
    - cron: "0 3 1 * *"

# Nothing at workflow level: each job names what it needs, so a job added
# later starts with no token rights at all.
permissions: {}

concurrency:
  group: hardened-publish
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve the platform tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PUBLIC: ${{ inputs.public }}
        run: |
          set -euo pipefail
          # The schedule takes only vX.Y.Z; a dispatch also takes a pre-release
          # vX.Y.Z-rc.N (N without a leading zero), for a private build only.
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          prerelease='^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$'
          if [ "$EVENT" = schedule ]; then
            # The newest vX.Y.Z tag on origin, peeled: an annotated tag's
            # "^{}" line names its commit, a lightweight tag's line already does.
            git ls-remote --tags "$REPO_URL" 'refs/tags/v*' > refs.txt
            tag=$(awk '{ sub("^refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' refs.txt \
                  | grep -E "$semver" | sort -u -V | tail -n 1) || true
            [ -n "$tag" ] || { echo "::error::no vX.Y.Z tag on origin"; exit 1; }
            sha=$(awk -v t="refs/tags/$tag^{}" '$2 == t { print $1 }' refs.txt)
            [ -n "$sha" ] || sha=$(awk -v t="refs/tags/$tag" '$2 == t { print $1 }' refs.txt)
          else
            if [ "$REF_TYPE" != tag ] \
               || ! printf '%s\n' "$REF_NAME" | grep -Eq -e "$semver" -e "$prerelease"; then
              echo "::error::run this on a vX.Y.Z or vX.Y.Z-rc.N tag (Use workflow from -> Tags), not on '$REF_NAME'"
              exit 1
            fi
            if printf '%s\n' "$REF_NAME" | grep -Eq "$prerelease" && [ "$PUBLIC" != false ]; then
              echo "::error::$REF_NAME is a pre-release tag: run it with public unticked (a private test build)"
              exit 1
            fi
            tag=$REF_NAME
            sha=$RUN_SHA
          fi
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::could not resolve $tag to a commit"; exit 1; }
          echo "building $tag at $sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish:
    name: guard, build and publish
    needs: resolve
    runs-on: ubuntu-latest
    # contents: write for the release asset, record and notes; id-token: write
    # for the OIDC role. Nothing broader.
    permissions:
      contents: write
      id-token: write
    environment: hardened-publish
    timeout-minutes: 240
    env:
      # One value for the guard and the build, so they cannot drift. Never
      # `inputs.public || 'true'`: a boolean false would collapse to 'true'.
      # A private build may keep image block public access on; the guard then
      # does not ask for it off.
      HARDENED_PUBLIC: ${{ github.event_name == 'schedule' && 'true' || inputs.public }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          # gh reads GH_TOKEN from the environment; nothing needs git auth.
          persist-credentials: false

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: 1.11.2

      # Cinc Workstation, as in ci.yml: the driver exports the solo Policyfile
      # lock with `chef`.
      - name: install Cinc Workstation
        run: |
          curl -fsSL https://omnitruck.cinc.sh/install.sh \
            | sudo bash -s -- -P cinc-workstation -v 26
          chef --version

      - id: aws-creds
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.HARDENED_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
          # 4 h, the job's timeout-minutes: credentials taken here outlive
          # every later step, the leftovers step after a build timeout too.
          role-duration-seconds: 14400

      - name: guard
        env:
          HARDENED_CI_ROLE_ARN: ${{ vars.HARDENED_PUBLISH_ROLE_ARN }}
        run: scripts/hardened-guard-check.sh

      # 180 minutes, under the job's 240: Packer may wait 2 h for the instance
      # to stop, then copies to every region. The step's clock starts only
      # after the steps above, so the job's last 60 minutes are split: up to
      # 45 for checkout, Packer and Cinc setup, credentials and the guard
      # (a few minutes in practice), and at least 15 left for the leftovers
      # step (it terminates the instance and deletes the key pair Packer may
      # not have had time to remove) and the record. The role session
      # (14400 s, above) covers the whole job, so those steps still hold
      # valid credentials.
      - name: build
        timeout-minutes: 180
        env:
          PLATFORM_TAG: ${{ needs.resolve.outputs.tag }}
          PLATFORM_SHA: ${{ needs.resolve.outputs.sha }}
          HARDENED_SECURITY_GROUP_ID: ${{ vars.HARDENED_BUILD_SG_ID }}
          HARDENED_ATTACHED_ORG_ID: ${{ vars.HARDENED_DEV_ORG_ID }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/hardened-image-build.sh

      # A failed build lists its leftovers itself, but a cancel or a timeout
      # can kill the driver before it does, and before Packer cleans up. The
      # driver writes the name it chose to dist/hardened-ami-name before
      # `packer build`; this step lists every image of that name, read-only,
      # into the job summary. It also terminates the build instance and
      # deletes Packer's packer_* key pair (both tagged
      # Name=idlefy-hardened-image-build, in the build region) — whether or
      # not a name was chosen: only build resources carry that tag, and the
      # concurrency group lets no other publish run be live. --clean-build
      # first checks the credentials are the publisher account's. Images are
      # never removed here; that is the owner's call (docs/runbook.md).
      - name: leftovers
        if: failure() || cancelled()
        env:
          # Without credentials nothing was launched, and every read would
          # only report "could not list".
          AWS_CREDS: ${{ steps.aws-creds.outcome }}
        run: |
          set +e -uo pipefail
          if [ "$AWS_CREDS" != success ]; then
            msg="No AWS credentials were configured: nothing could have been launched."
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=(--clean-build)
          if [ -s dist/hardened-ami-name ]; then
            args+=("$(head -n 1 dist/hardened-ami-name)")
          fi
          scripts/hardened-image-leftovers.sh "${args[@]}" > leftovers.txt 2>&1
          rc=$?
          {
            echo "### What this run may have left behind"
            echo
            if [ ${#args[@]} -eq 1 ]; then
              echo "The build chose no image name, or its record was uploaded: no images to list."
              echo
            fi
            echo '```text'
            cat leftovers.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat leftovers.txt
          exit "$rc"

      # The record is also on the release; this copy survives a failed upload.
      - name: record
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/hardened-ami-*.json)
          [ ${#files[@]} -gt 0 ] || { echo "no release record was written" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          for f in "${files[@]}"; do
            {
              echo "### $(basename "$f")"
              echo
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
