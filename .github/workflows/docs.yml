# Builds the MkDocs site on every PR (a broken link fails the PR) and deploys
# it to GitHub Pages on every push to main. Pages source must be "GitHub
# Actions" (set once by the maintainer: gh api -X POST repos/idlefy/vm-platform-aws/pages -f build_type=workflow).
name: docs

on:
  # No paths filter on pull_request: `docs / build` is a required check on main,
  # and a required check that never runs leaves a code-only PR pending forever.
  pull_request:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    # Never from a pull_request: a same-repo PR would publish its artifact and
    # a fork PR would fail on the read-only token.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
